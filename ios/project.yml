name: KunTartibi
options:
  bundleIdPrefix: uz.fuzayil
  deploymentTarget:
    iOS: "15.0"
targets:
  KunTartibi:
    type: application
    platform: iOS
    sources:
      - path: KunTartibi
        excludes:
          - "icon.b64"
    info:
      path: KunTartibi/Info.plist
      properties:
        CFBundleDisplayName: Kun Tartibi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.fuzayil.kuntartibi
        PRODUCT_NAME: KunTartibi
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
