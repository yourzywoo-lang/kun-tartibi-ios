name: iOS ilovani yig'ish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Ikonkani tiklash
        run: base64 -D -i ios/KunTartibi/icon.b64 -o ios/KunTartibi/Assets.xcassets/AppIcon.appiconset/icon.png
      - name: XcodeGen o'rnatish
        run: brew install xcodegen
      - name: Xcode loyihasini yaratish
        run: cd ios && xcodegen generate
      - name: Ilovani yig'ish (imzosiz)
        run: |
          cd ios
          xcodebuild -project KunTartibi.xcodeproj -target KunTartibi -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: IPA faylini tayyorlash
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Release-iphoneos/KunTartibi.app Payload/
          zip -qry KunTartibi.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: KunTartibi-ipa
          path: ios/KunTartibi.ipa
      - name: IPA faylini "ipa" branchiga joylash
        run: |
          cd ios
          mkdir -p /tmp/out && cp KunTartibi.ipa /tmp/out/
          cd /tmp/out
          git init -q -b ipa
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add KunTartibi.ipa
          git commit -qm "IPA ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ipa
