<!doctype html><html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kun Tartibi">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>Fuzayil Kun Tartibi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a111c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column (two columns ≥ 980px on Bugun). A live sky card heads the day; timeline below; tab bar at the bottom. */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface2:#e7edf4; --surface3:#dbe4ee; --fg:#0f1b2a; --muted:#5d6f82; --line:#dbe3ec;
  --accent:#2463c9; --accent-fg:#ffffff; --turq:#0f9488; --gold:#b37c14; --gold-bg:#fbf2df; --danger:#c63d2f; --ok:#23885a;
  --k-maktab:#2463c9; --k-yol:#7d8a98; --k-ovqat:#23885a; --k-dam:#7a52c7; --k-tel:#c9447f; --k-kocha:#d9711c; --k-dost:#c4561b; --k-ish:#0f9488; --k-uyqu:#4b5c7c; --k-namoz:#b37c14; --k-boshqa:#6b7c8e;
  --shadow:0 1px 2px rgba(15,27,42,.06),0 8px 24px -12px rgba(15,27,42,.18);
  --display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --body:"Onest","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a111c; --surface:#111b2a; --surface2:#172436; --surface3:#1f2f45; --fg:#e8eef6; --muted:#8fa1b5; --line:#1e2c40;
  --accent:#6ea6ff; --accent-fg:#0a111c; --turq:#3cc7b8; --gold:#f0b955; --gold-bg:#2a2210; --danger:#ff7a6b; --ok:#4fd08f;
  --k-maktab:#6ea6ff; --k-yol:#93a1ae; --k-ovqat:#4fd08f; --k-dam:#ab8bf0; --k-tel:#f082b5; --k-kocha:#f5a25c; --k-dost:#f38b57; --k-ish:#3cc7b8; --k-uyqu:#8fa2c8; --k-namoz:#f0b955; --k-boshqa:#9aa9b8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a111c; --surface:#111b2a; --surface2:#172436; --surface3:#1f2f45; --fg:#e8eef6; --muted:#8fa1b5; --line:#1e2c40;
  --accent:#6ea6ff; --accent-fg:#0a111c; --turq:#3cc7b8; --gold:#f0b955; --gold-bg:#2a2210; --danger:#ff7a6b; --ok:#4fd08f;
  --k-maktab:#6ea6ff; --k-yol:#93a1ae; --k-ovqat:#4fd08f; --k-dam:#ab8bf0; --k-tel:#f082b5; --k-kocha:#f5a25c; --k-dost:#f38b57; --k-ish:#3cc7b8; --k-uyqu:#8fa2c8; --k-namoz:#f0b955; --k-boshqa:#9aa9b8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:19px;font-weight:800}
h3{font-size:15px;font-weight:700}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.note{font-size:13px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:var(--r-sm);padding:10px 14px;font-weight:600;background:var(--surface2);color:var(--fg);
  transition:transform .15s var(--ease),background-color .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--surface3)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.gold{background:var(--gold);color:#1a1203}
.btn.danger{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.big{padding:15px 18px;font-size:16px;border-radius:var(--r-md);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}

/* app bar */
.appbar{max-width:1120px;margin:0 auto;padding-block:14px 6px;display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:linear-gradient(160deg,#1f4fa0,#173a77);box-shadow:var(--shadow)}
.mark svg{width:24px;height:24px}
.appbar .ttl{flex:1;min-width:0}
.appbar h1{font-size:21px;font-weight:800;line-height:1.1}
.appbar .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.chip.school{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.chip.off{background:color-mix(in srgb,var(--turq) 16%,transparent);color:var(--turq)}

main{max-width:1120px;margin:0 auto;padding-block:8px}
.view{animation:viewIn .32s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Bugun layout */
.bugun{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.bugun{grid-template-columns:400px minmax(0,1fr);align-items:start}.bugun .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.mainCol{display:flex;flex-direction:column;gap:12px;min-width:0}

/* sky hero */
.sky{position:relative;border-radius:22px;overflow:hidden;color:#fff;box-shadow:var(--shadow);isolation:isolate;min-height:196px}
.sky svg.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.sky .in{padding:16px 18px 14px;display:flex;flex-direction:column;gap:2px;height:100%}
.sky .clock{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.02em;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.sky .lbl{font-size:13px;font-weight:600;opacity:.92;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.sky .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.sky .nextp{display:flex;align-items:baseline;gap:8px;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.35);background:rgba(0,0,0,.18);padding:6px 11px;border-radius:12px;backdrop-filter:blur(4px)}
.sky .sun{font-family:var(--mono);font-size:11.5px;font-weight:600;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.sky .nextp .mono{font-size:20px}

/* prayer pills */
.pills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:9px 2px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s var(--ease),border-color .2s,background-color .2s}
.pill:active{transform:scale(.95)}
.pill b{font-size:11.5px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill .mono{font-size:14px;font-weight:700}
.pill i{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:600}
.pill.ok{border-color:color-mix(in srgb,var(--ok) 60%,transparent);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.pill.ok i{color:var(--ok)}
.pill.qazo{border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
.pill.qazo i{color:var(--danger)}
.pill.due{border-color:var(--gold);background:var(--gold-bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
.pill.due i{color:var(--gold)}

/* now card */
.now{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--kc,var(--accent))}
.now .t{font-family:var(--display);font-size:20px;font-weight:800;line-height:1.2;min-width:0}
.now .left{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;align-self:center;grid-row:1/3;grid-column:2;text-align:right;line-height:1.05;white-space:nowrap;font-variant-numeric:tabular-nums}
.now .left u{text-decoration:none;font-size:14px;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:0}
.now .left small{display:block;font-size:11px;color:var(--muted);font-family:var(--body);font-weight:600}
.now .nx{font-size:13px;color:var(--muted);min-width:0}
.bar{grid-column:1/-1;height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--kc,var(--accent));border-radius:5px;transition:width .8s var(--ease)}

/* day nav + timeline */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .lbl{flex:1;text-align:center;min-width:0}
.daynav .lbl b{display:block;font-family:var(--display);font-size:17px}
.daynav .lbl span{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s var(--ease)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:20px;height:20px}
.banner{background:var(--gold-bg);border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);border-radius:var(--r-md);padding:10px 12px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.tl .part{padding:12px 16px 6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.tl .part::after{content:"";flex:1;height:1px;background:var(--line)}
.blk{display:grid;grid-template-columns:54px 4px minmax(0,1fr);gap:0 12px;padding:9px 16px;align-items:center;position:relative;transition:background-color .35s,opacity .35s}
.blk .tm{font-family:var(--mono);font-size:13px;font-weight:700;line-height:1.25}
.blk .tm small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.blk .rail{align-self:stretch;border-radius:4px;background:var(--kc);opacity:.85;min-height:30px}
.blk .ti{font-weight:600;min-width:0;overflow-wrap:anywhere}
.blk .ti small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:1px}
.blk.past{opacity:.48}
.blk.cur{background:color-mix(in srgb,var(--kc) 10%,transparent)}
.blk .hz{display:none;margin-left:8px;font-size:10px;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:var(--kc);color:var(--surface);vertical-align:2px}
.blk.cur .hz{display:inline-block}
.blk.namoz .ti{color:var(--gold)}
.blk.namoz{background:color-mix(in srgb,var(--gold-bg) 70%,transparent)}
.blk.namoz.cur{background:var(--gold-bg)}
.blk.conflict .ti small{color:var(--danger);font-weight:600}
.blk .st{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.st.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.st.qazo{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.edited{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--turq);font-weight:600}
.jump{position:fixed;left:50%;margin-left:-62px;width:124px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:9;border:0;border-radius:999px;padding:8px 12px;background:var(--fg);color:var(--bg);font-weight:700;font-size:13px;box-shadow:var(--shadow);transition:opacity .25s,transform .25s var(--ease)}
.jump.off{opacity:0;transform:translateY(12px);pointer-events:none}
.pill.missed i{color:var(--muted);opacity:.75}

/* namoz view */
.streak{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{width:96px;height:96px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--display);font-size:34px;font-weight:800;color:var(--gold);line-height:1}
.ring span{position:absolute;bottom:20px;font-size:10px;font-weight:700;color:var(--muted)}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .nm{font-weight:700;font-size:16px}
.prow .nm small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.qazo{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.tag.due{background:var(--gold-bg);color:var(--gold)}
.heat{overflow-x:auto}
.heat table{border-collapse:separate;border-spacing:4px;width:100%;min-width:300px;font-size:11.5px}
.heat th{font-weight:600;color:var(--muted);text-align:center}
.heat td{text-align:center}
.heat td:first-child{text-align:left;color:var(--muted);white-space:nowrap;font-weight:600}
.cell{display:block;height:22px;border-radius:6px;background:var(--surface2)}
.cell.ok{background:var(--ok)} .cell.qazo{background:var(--danger)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--surface3);position:relative;flex:none;cursor:pointer;transition:background-color .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .22s var(--ease)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(18px)}
.switch small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}

/* calendar */
.cal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal .d{border:0;border-radius:10px;aspect-ratio:1/1;max-width:100%;font-family:var(--mono);font-size:13.5px;font-weight:600;background:var(--surface2);position:relative;transition:transform .15s var(--ease),background-color .2s}
.cal .d:active{transform:scale(.92)}
.cal .d.off{background:color-mix(in srgb,var(--turq) 20%,transparent);color:var(--turq)}
.cal .d.hol{background:color-mix(in srgb,var(--danger) 17%,transparent);color:var(--danger)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d.sel{background:var(--accent);color:var(--accent-fg)}
.cal .d.blank{visibility:hidden}
.cal .d .dot{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.hlist{display:flex;flex-direction:column}
.hlist div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:10px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.hlist div:first-child{border-top:0}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:13px;color:var(--muted);transition:background-color .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* AI */
.aiwrap{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:11px 14px;border-radius:16px;max-width:86%;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .28s var(--ease) both;font-size:14.5px}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.msg.err{border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.msg .go{margin-top:8px}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg .btn{white-space:nowrap;flex:none}
.composer{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.composer textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:15px;padding:8px;max-height:140px;min-height:40px;outline:none}
.composer .btn{border-radius:12px;height:42px}

/* settings */
.sgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.sgrid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}

<script id="core">
/* ===== CORE (pure logic; also used to build calendar files) ===== */
var Core = (function(){
const r=Math.PI/180,ds=x=>Math.sin(x*r),dc=x=>Math.cos(x*r),dt=x=>Math.tan(x*r),das=x=>Math.asin(x)/r,dac=x=>Math.acos(x)/r,dat2=(y,x)=>Math.atan2(y,x)/r,dacot=x=>Math.atan(1/x)/r,fix=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
function jul(y,m,d){if(m<=2){y--;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}

const DEFAULTS = {
  version:1,
  lat:41.2995, lng:69.2401, tz:5,
  offsets:{fajr:-3,sunrise:0,dhuhr:1,asr:0,maghrib:3,isha:3},
  prayerMin:12,
  home:"Chilonzor, opera teatri oldi", school:"PDP School, Sergeli (Mashina bozori ro‘parasi)",
  wakeSchool:"06:30", leaveHome:"07:15", commute:40, breakfast:"08:00",
  wakeOff:"09:30", outStart:"20:00", outEnd:"23:00", workStart:"23:15", workEnd:"00:45", sleep:"01:00",
  reelsMin:30, friendDay:6, friendStart:"15:00", friendEnd:"22:30", friendTravel:40,
  timetable:{
    1:"09:00-09:45 Jahon tarixi | 203\n09:55-10:40 Jismoniy tarbiya | Sport zali A\n10:50-11:35 SAT-3 guruh | Matematika o‘rniga\n11:45-12:30 SAT-3 guruh | Matematika o‘rniga\n13:30-14:15 Ona tili | 203\n14:25-15:10 Rus tili | 203\n15:35-16:20 Fazilatli liderlik | 203\n16:30-17:15 Tabiiy fanlar (Fizika) | 309"
  },
  sameEveryDay:true,
  geminiKey:"", geminiModel:"gemini-flash-latest",
  notify:true, gate:true
};

/* Uzbekistan 2026/2027 school-year breaks & public holidays (approx = taxminiy, moon-based) */
const HOLIDAYS = [
  ["2026-11-04","2026-11-09","Kuzgi ta’til (1-chorak tugadi)","tatil"],
  ["2026-12-08","2026-12-08","Konstitutsiya kuni","bayram"],
  ["2026-12-28","2027-01-10","Qishki ta’til (2-chorak tugadi)","tatil"],
  ["2027-01-01","2027-01-02","Yangi yil","bayram"],
  ["2027-03-08","2027-03-08","Xotin-qizlar kuni","bayram"],
  ["2027-03-10","2027-03-10","Ramazon hayiti (taxminiy sana)","bayram"],
  ["2027-03-21","2027-03-27","Bahorgi ta’til, Navro‘z (3-chorak tugadi)","tatil"],
  ["2027-05-09","2027-05-10","Xotira va qadrlash kuni","bayram"],
  ["2027-05-16","2027-05-17","Qurbon hayiti (taxminiy sana)","bayram"],
  ["2027-05-25","2027-09-01","Yozgi ta’til (o‘quv yili tugadi)","tatil"],
  ["2027-09-01","2027-09-01","Mustaqillik kuni","bayram"],
  ["2027-10-01","2027-10-01","O‘qituvchi va murabbiylar kuni","bayram"]
];

const KINDS = {maktab:"Maktab",yol:"Yo‘l",ovqat:"Ovqat",dam:"Dam / o‘yin",tel:"Telefon",kocha:"Ko‘cha",dost:"Do‘stlar",ish:"Noutbukda ish",uyqu:"Uyqu",namoz:"Namoz",boshqa:"Boshqa"};
const PRAYERS = [["fajr","Bomdod"],["dhuhr","Peshin"],["asr","Asr"],["maghrib","Shom"],["isha","Xufton"]];
const WD = ["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
const MONTHS = ["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];

const hm = s => { if(typeof s==="number") return s; const [h,m]=String(s).split(":").map(Number); return h*60+(m||0); };
const fmt = m => { m=Math.round(m); const mm=((m%1440)+1440)%1440; return String(Math.floor(mm/60)).padStart(2,"0")+":"+String(mm%60).padStart(2,"0"); };
const ymd = d => d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
const parseD = s => { const [y,m,d]=s.split("-").map(Number); return new Date(Date.UTC(y,m-1,d)); };
const addDays = (s,n) => { const d=parseD(s); d.setUTCDate(d.getUTCDate()+n); return ymd(d); };
const weekday = s => parseD(s).getUTCDay();
const nightMin = (s, wakeRef) => { let m=hm(s); if(m < 12*60 && m < hm(wakeRef)) m+=1440; return m; }; // 00:45 -> 1485

function prayerTimes(dateStr, S){
  S = S||DEFAULTS; const lat=S.lat, lng=S.lng, tz=S.tz;
  const [y,m,d]=dateStr.split("-").map(Number); const jd=jul(y,m,d)-lng/(15*24);
  const sp=t=>{const D=jd+t-2451545,g=fix(357.529+.98560028*D,360),q=fix(280.459+.98564736*D,360),L=fix(q+1.915*ds(g)+.02*ds(2*g),360),e=23.439-.00000036*D,RA=dat2(dc(e)*ds(L),dc(L))/15;return{eq:q/15-fix(RA,24),de:das(ds(e)*ds(L))}};
  const mid=t=>fix(12-sp(t).eq,24);
  const sa=(a,t,ccw)=>{const de=sp(t).de,T=dac((-ds(a)-ds(de)*ds(lat))/(dc(de)*dc(lat)))/15;return mid(t)+(ccw?-T:T)};
  const asr=t=>{const de=sp(t).de;return sa(-dacot(2+dt(Math.abs(lat-de))),t)};
  const o={fajr:sa(15,5/24,1),sunrise:sa(.833,6/24,1),dhuhr:mid(12/24),asr:asr(13/24),maghrib:sa(.833,18/24),isha:sa(15,18/24)};
  const off=Object.assign({},DEFAULTS.offsets,S.offsets||{});
  for(const k in o) o[k]=Math.round((o[k]+tz-lng/15)*60)+(off[k]||0);
  return o;
}

function holidayOn(dateStr){
  return HOLIDAYS.filter(h=>dateStr>=h[0]&&dateStr<=h[1]).map(h=>({name:h[2],type:h[3]}));
}
function isSchoolDay(dateStr, state){
  const ov = state && state.dayType && state.dayType[dateStr];
  if(ov==="school") return true; if(ov==="off") return false;
  const wd=weekday(dateStr); if(wd===0||wd===6) return false;
  return holidayOn(dateStr).length===0;
}
function parseTimetable(txt){
  return String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(\d{1,2}[:.]\d{2})\s*[-–]\s*(\d{1,2}[:.]\d{2})\s+(.+)$/); if(!m) return null;
    const [title,place]=m[3].split("|").map(x=>x&&x.trim());
    return {s:hm(m[1].replace(".",":")),e:hm(m[2].replace(".",":")),title,place:place||""};
  }).filter(Boolean).sort((a,b)=>a.s-b.s);
}
function lessonsFor(dateStr,S){
  const wd=weekday(dateStr);
  const txt = S.sameEveryDay ? S.timetable[1] : (S.timetable[wd]||S.timetable[1]);
  return parseTimetable(txt);
}

const B=(s,e,title,kind,note,hard)=>({s:Math.round(s),e:Math.round(e),title,kind,note:note||"",hard:!!hard});

/* base (non-prayer) plan */
function basePlan(dateStr,S,state){
  const school=isSchoolDay(dateStr,state), wd=weekday(dateStr);
  const friend = (+S.friendDay===wd);
  const out=[];
  const sleepM = nightMin(S.sleep,"06:00");
  const workS = nightMin(S.workStart,"06:00"), workE = nightMin(S.workEnd,"06:00");
  const outS=hm(S.outStart), outE=nightMin(S.outEnd,"06:00");
  if(school){
    const w=hm(S.wakeSchool), lv=hm(S.leaveHome), c=+S.commute||40, bf=hm(S.breakfast);
    out.push(B(w,w+15,"Uyg‘onish, yuvinish","boshqa"));
    if(lv>w+15) out.push(B(w+15,lv,"Kiyinish, sumkani yig‘ish","boshqa"));
    out.push(B(lv,lv+c,"Yo‘l: uy → PDP School","yol","Chilonzordan Sergeliga",true));
    out.push(B(bf,bf+30,"Zavtrak (maktabda)","ovqat"));
    const L=lessonsFor(dateStr,S);
    L.forEach(l=>out.push(B(l.s,l.e,l.title,"maktab",l.place?(/^\d/.test(l.place)?"Xona "+l.place:l.place):"",true)));
    // longest gap between lessons -> lunch
    let best=null; for(let i=1;i<L.length;i++){const g=L[i].s-L[i-1].e; if(g>=35&&(!best||g>best.g)) best={g,s:L[i-1].e,e:L[i].s};}
    if(best) out.push(B(best.s,best.e,"Tushlik (maktabda)","ovqat"));
    const end = L.length? L[L.length-1].e : 13*60;
    out.push(B(end,end+c,"Yo‘l: maktab → uy","yol","",true));
    let t=end+c;
    out.push(B(t,t+35,"Kechki ovqat, dam","ovqat")); t+=35;
    out.push(B(t,t+(+S.reelsMin||30),"Telefon / rils (limit "+(+S.reelsMin||30)+" daqiqa)","tel")); t+=(+S.reelsMin||30);
    if(friend){
      if(outS>t) out.push(B(t,outS,"Noutbukda o‘yin / dam","dam"));
      out.push(B(outS,outE,"Uzoqdagi do‘stlar oldiga (haftada 1 marta)","dost","Ko‘chaga chiqish o‘rniga"));
    } else {
      if(outS>t) out.push(B(t,outS,"Noutbukda o‘yin / dam","dam"));
      out.push(B(outS,outE,"Ko‘chada aylanish","kocha","Soat "+fmt(outE)+" gacha uyga"));
    }
  } else {
    const w=hm(S.wakeOff);
    out.push(B(w,w+20,"Uyg‘onish, yuvinish","boshqa"));
    out.push(B(w+20,w+50,"Nonushta","ovqat"));
    let t=w+50;
    if(friend){
      const fs=hm(S.friendStart), fe=nightMin(S.friendEnd,"06:00"), ft=+S.friendTravel||40;
      out.push(B(t,13*60,"Noutbukda o‘yin","dam"));
      out.push(B(13*60,13*60+40,"Tushlik","ovqat"));
      out.push(B(13*60+40,13*60+40+(+S.reelsMin||30),"Telefon / rils (limit)","tel"));
      if(fs-ft>13*60+40+(+S.reelsMin||30)) out.push(B(13*60+40+(+S.reelsMin||30),fs-ft,"Erkin vaqt, tayyorgarlik","boshqa"));
      out.push(B(fs-ft,fs,"Yo‘l: do‘stlar oldiga","yol","",true));
      out.push(B(fs,fe,"Uzoqdagi do‘stlar oldida","dost","Haftada 1 marta, dam olish kuni uzunroq"));
      out.push(B(fe,fe+ft,"Yo‘l: uyga","yol","",true));
    } else {
      out.push(B(t,13*60,"Noutbukda o‘yin","dam"));
      out.push(B(13*60,13*60+40,"Tushlik","ovqat"));
      t=13*60+40;
      out.push(B(t,t+(+S.reelsMin||30),"Telefon / rils (limit)","tel")); t+=(+S.reelsMin||30);
      out.push(B(t,17*60,"Uy ishlari, dars tayyorlash, erkin vaqt","boshqa"));
      out.push(B(17*60,19*60,"Noutbukda o‘yin","dam"));
      out.push(B(19*60,19*60+40,"Kechki ovqat","ovqat"));
      if(outS>19*60+40) out.push(B(19*60+40,outS,"Dam olish","dam"));
      out.push(B(outS,outE,"Ko‘chada aylanish","kocha","Soat "+fmt(outE)+" gacha uyga"));
    }
  }
  const lastEnd = Math.max(...out.map(b=>b.e));
  if(workS>lastEnd) out.push(B(lastEnd,workS,"Uyga kelib yuvinish","boshqa"));
  out.push(B(Math.max(workS,lastEnd),workE,"Noutbukda ishlar","ish","Shu vaqtgacha yakunla"));
  if(sleepM>workE) out.push(B(workE,sleepM,"Uxlashga tayyorgarlik (telefon yo‘q)","boshqa"));
  out.push(B(sleepM,sleepM+1,"Uxlash","uyqu","",true));
  return out.sort((a,b)=>a.s-b.s);
}

/* insert prayers: cannot be removed by edits; they cut flexible blocks */
function placePrayers(blocks,dateStr,S){
  const p=prayerTimes(dateStr,S), dur=+S.prayerMin||12;
  const sleepAt = Math.max(...blocks.filter(b=>b.kind==="uyqu").map(b=>b.s), 23*60);
  const hard = blocks.filter(b=>b.hard && b.kind!=="uyqu");
  const free=(s,e)=>!hard.some(h=>s<h.e&&e>h.s);
  const res=[];
  const firstWake = Math.min(...blocks.map(b=>b.s));
  // Bomdod
  const fW=[p.fajr,p.sunrise];
  let bS;
  if(firstWake>=p.fajr && firstWake+dur+5<=p.sunrise){ bS=firstWake+5; res.push({s:bS,e:bS+dur,key:"fajr"}); }
  else if(firstWake<p.fajr){ bS=p.fajr+5; res.push({s:bS,e:bS+dur,key:"fajr"}); }
  else { bS=p.fajr+10; res.push({s:bS,e:bS+dur,key:"fajr",wake:true}); }
  const windows={dhuhr:[p.dhuhr,p.asr],asr:[p.asr,p.maghrib-5],maghrib:[p.maghrib,p.isha],isha:[p.isha,Math.max(sleepAt,p.isha+60)]};
  for(const k of ["dhuhr","asr","maghrib","isha"]){
    const [ws,we]=windows[k]; let got=null;
    for(const d of [dur,10]){ for(let t=ws+2;t+d<=we;t++){ if(free(t,t+d)){got={s:t,e:t+d};break;} } if(got)break; }
    if(got) res.push(Object.assign(got,{key:k})); else res.push({s:ws,e:ws+dur,key:k,conflict:true});
  }
  const names=Object.fromEntries(PRAYERS);
  const pBlocks=res.map(x=>{
    const [ws,we]= x.key==="fajr"?fW:windows[x.key];
    const b=B(x.s,x.e,(x.wake?"Uyg‘on! ":"")+"Taxorat + "+names[x.key]+" namozi","namoz",
      x.conflict?"⚠ Bu vaqtda dars/yo‘l bor — tanaffusda yoki birinchi imkonda o‘qi ("+fmt(we)+" gacha)":"Vaqti: "+fmt(ws)+"–"+fmt(we),true);
    b.prayer=x.key; b.window=[ws,we]; b.conflict=!!x.conflict; return b;
  });
  // cut flexible blocks around prayers
  let out=blocks.slice();
  for(const pb of pBlocks){
    const nx=[];
    for(const b of out){
      if(b.hard||b.e<=pb.s||b.s>=pb.e){nx.push(b);continue;}
      if(b.s<pb.s) nx.push(Object.assign({},b,{e:pb.s}));
      if(b.e>pb.e) nx.push(Object.assign({},b,{s:pb.e}));
    }
    out=nx;
  }
  // bomdod before wake -> "sleep again" block
  const fb=pBlocks[0];
  if(fb.e<firstWake-15) out.push(B(fb.e,firstWake,"Yana uxlash mumkin","uyqu","Budilnik: "+fmt(firstWake)));
  out=out.filter(b=>b.hard||b.kind==="uyqu"||b.s===firstWake||b.e-b.s>=8).concat(pBlocks).filter(b=>b.e>b.s).sort((a,b)=>a.s-b.s||(a.kind==="namoz"?-1:1));
  return {blocks:out,times:p};
}

function planFor(dateStr,state){

  const a=dueAlarm(); if(a){ closeOverlay(); ringAlarm(a); return; }
  const g=dueGate();
  if(!g){ if(ovKind==="gate") closeOverlay(); return; }
  if(ovKind==="gate"&&ovKey===g.key){ ovRefs.due=g; updateGate(); } else showGate(g);
}
window.__nativeAlarm=function(title){ const a=dueAlarm(); ringAlarm(a||{key:"native|"+Date.now(),title:title||"Uyg‘on!",test:true}); };
window.__nativeWake=function(){ tick(); };

/* ================= TICK ================= */
let fired={}, pendingRoll=null;
function tick(){
  const t=nowT();
  if(!state.seen[t.date]){ state.seen[t.date]=1; prune(); persist(); }
  if(lastDate&&lastDate!==t.date){ fired={}; planCache.clear(); if(viewDate!==lastDate){ render(); } scheduleNative(); pendingRoll=lastDate; }
  if(pendingRoll){ const yb=plan(pendingRoll).blocks, endY=Math.max(...yb.map(b=>b.e))-1440; if(t.min>=endY||viewDate!==pendingRoll){ if(viewDate===pendingRoll){ viewDate=t.date; render(); } pendingRoll=null; } }
  lastDate=t.date;
  const tl=timeline();
  tl.items.forEach(b=>{ const key=b.day+"|"+b.s+"|"+b.title;
    if(t.min>=b.s&&t.min<b.s+1.5&&!fired[key]){ fired[key]=1; if(b.kind!=="namoz"){ toast(C.fmt(b.s)+" · "+b.title); chime();
      if(!P.native&&"Notification" in window&&Notification.permission==="granted"){ try{new Notification(C.fmt(b.s)+" · "+b.title,{body:b.note||"",tag:key});}catch(e){} } } } });
  C.PRAYERS.forEach(([k,n])=>{ const key=t.date+"|azan|"+k; if(t.min>=tl.plan.times[k]&&t.min<tl.plan.times[k]+1.5&&!fired[key]){ fired[key]=1; chime();
    if(!P.native&&"Notification" in window&&Notification.permission==="granted"){ try{new Notification(n+" vaqti kirdi",{body:"Taxorat ol, namozni kechiktirma",tag:key});}catch(e){} } } });
  updateLive(); overlays();
}

/* ================= BOOT ================= */
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{ if(view===b.dataset.v){window.scrollTo({top:0,behavior:"smooth"});return;} view=b.dataset.v; if(view==="bugun") viewDate=nowT().date; window.scrollTo(0,0); render(); }));
render(); lastDate=nowT().date;
connectSync(); scheduleNative();
setTimeout(tick,600);
(function loop(){ const s=nowT().sec; setTimeout(()=>{tick();loop();},Math.max(1000,(60-s)*1000%15000||15000)); })();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ tick(); scheduleNative(); } });
if(window.__LAUNCH_ALARM) setTimeout(()=>window.__nativeAlarm("Uyg‘on!"),900);
})();
</script>
